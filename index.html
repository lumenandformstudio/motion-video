<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamr Network</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e9e9; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  video::-webkit-media-controls { display: none !important; }
</style>
</head>
<body>
  <video src="streamr-network.mp4" poster="poster.jpg" autoplay muted loop playsinline disablepictureinpicture disableremoteplayback></video>
  <script>
    // Nudge playback in case the browser blocks autoplay on first load
    const v = document.querySelector('video');
    v.muted = true;
    const p = v.play(); if (p) p.catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) v.play().catch(() => {}); });
  </script>
</body>
</html>
